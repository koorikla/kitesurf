name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, unreal]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build KiteSurfEditor
        run: scripts/build.sh Development

      - name: Run Automation Tests
        run: scripts/run-tests.sh -nullrhi

  gpu-smoke:
    runs-on: [self-hosted, linux, unreal]
    needs: build-and-test
    continue-on-error: true
    concurrency: gpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build KiteSurfEditor
        run: scripts/build.sh Development

      - name: Run GPU Smoke Test
        run: |
          # Runs the gameplay map so the screenshot shows the ocean, rider and HUD.
          scripts/smoke-test.sh /Game/Maps/L_OpenWater 600

      - name: Upload GPU Smoke Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-smoke-artifacts
          path: |
            Saved/Logs/KiteSurf.log
            Saved/Screenshots/LinuxEditor/*.png
          if-no-files-found: warn
