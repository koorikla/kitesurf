; --- Lumen ray tracing data -------------------------------------------------
; Primary path: HARDWARE ray tracing. The GPU is an NVIDIA RTX 5060 and the
; Vulkan driver exposes VK_KHR_acceleration_structure, VK_KHR_ray_query and
; VK_KHR_ray_tracing_pipeline; SF_VULKAN_SM6 sets bSupportsRayTracing=true in
; Engine/Config/VulkanPC/DataDrivenPlatformInfo.ini.
;
; r.SkinCache.CompileShaders MUST be >= 1 before r.RayTracing=1. RenderUtils.cpp
; (IsRayTracingAllowed init) logs Fatal "Ray tracing requires skin cache to be
; enabled" otherwise, and the engine default for that CVar is 0.
r.SkinCache.CompileShaders=1
r.RayTracing=1
r.Raytracing.Enable=1
r.RayTracing.RayTracingProxies.ProjectEnabled=1
;
; Fallback path kept deliberately: mesh distance fields stay enabled so that
; Lumen::IsSoftwareRayTracingSupported() is also true. This resolves the
; "Lumen is enabled, but has no ray tracing data" warning (Lumen.cpp:333) by
; either branch, so Lumen still has tracing data if hardware RT is unavailable
; at runtime (driver fallback, different GPU). Requires
; r.DistanceFields.SupportEvenIfHardwareRayTracingSupported=1, since
; DoesProjectSupportDistanceFields() (SceneManagement.cpp:61) otherwise returns
; false whenever ray tracing is allowed.
r.GenerateMeshDistanceFields=1
r.DistanceFields.SupportEvenIfHardwareRayTracingSupported=1
r.DistanceFields.DefaultVoxelDensity=0.2
r.Lumen.TraceMeshSDFs=1

